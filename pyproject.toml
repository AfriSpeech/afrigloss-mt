[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afrigloss-mt"
version = "0.1.0"
description = "African Glossary-Constrained Machine Translation Toolkit for 693 African Languages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mich-Seth Owusu", email = "michseth@ghananlp.org" }
]
keywords = [
    "nlp",
    "machine-translation",
    "african-languages",
    "glossary",
    "opus-mt",
    "marianmt",
    "twi",
    "yoruba",
    "swahili",
    "zulu"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "huggingface_hub>=0.20.0",
    "datasets>=2.18.0",
    "pycountry>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
afrigloss = "afrigloss.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["afrigloss*"]
